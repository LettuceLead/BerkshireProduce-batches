<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Batch Lookup — LettuceLead</title>
<style>
  :root{
    --malachite:#0BDA51;
    --malachite-dark:#08a63d;
    --cream:#FCFEDA;
    --ink:#0a0a0a;
    --ink-soft:#3a3d36;
    --line:#e2e4ce;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  header{
    width:100%;
    background:#111111;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  header img{
    height:36px;
    width:auto;
    display:block;
  }

  main{
    width:100%;
    max-width:480px;
    padding:22px 16px 40px;
    flex:1;
  }

  /* ---- loading / empty / error states ---- */
  .state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .state h2{font-size:18px;margin:14px 0 6px;color:var(--ink);}
  .state p{font-size:14px;line-height:1.5;margin:0;}
  .spinner{
    width:26px;height:26px;margin:0 auto;
    border:3px solid var(--line);
    border-top-color:var(--malachite);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .search-box{
    margin-top:18px;
    display:flex;
    gap:8px;
    justify-content:center;
  }
  .search-box input{
    font-family:inherit;
    font-size:16px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    width:160px;
    text-align:center;
    text-transform:uppercase;
  }
  .search-box button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--malachite);
    cursor:pointer;
  }

  /* ---- batch card ---- */
  .card{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    padding:22px 20px 20px;
    display:none;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:700;
    margin:0 0 4px;
  }
  .batch-number{
    font-size:34px;
    font-weight:800;
    letter-spacing:-0.5px;
    margin:0 0 2px;
    line-height:1.1;
  }
  .variety-line{
    font-size:16px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .variety-line b{color:var(--ink);}

  .status-pill{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(11,218,81,0.14);
    color:var(--malachite-dark);
    margin-bottom:20px;
  }
  .status-pill.done{background:rgba(10,10,10,0.08);color:var(--ink-soft);}
  .status-pill.notyet{background:rgba(10,10,10,0.05);color:var(--ink-soft);}

  /* ---- timeline ---- */
  .timeline{
    display:flex;
    justify-content:space-between;
    position:relative;
    margin:0 4px 22px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    top:7px; left:12px; right:12px;
    height:2px;
    background:var(--line);
    z-index:0;
  }
  .tl-node{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:25%;
  }
  .tl-dot{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--cream);
    border:2px solid var(--line);
  }
  .tl-node.complete .tl-dot{background:var(--ink);border-color:var(--ink);}
  .tl-node.current .tl-dot{background:var(--malachite);border-color:var(--malachite);
    box-shadow:0 0 0 4px rgba(11,218,81,0.2);}
  .tl-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.3px;
    margin-top:8px;
    color:var(--ink-soft);
  }
  .tl-date{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
    text-align:center;
  }
  .tl-node.pending .tl-label, .tl-node.pending .tl-date{opacity:0.55;}

  /* ---- stats grid ---- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:6px;
  }
  .stat{
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 8px;
    text-align:center;
  }
  .stat .v{font-size:18px;font-weight:800;line-height:1.1;}
  .stat .k{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.3px;margin-top:3px;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:10px 2px;
    border-top:1px solid var(--line);
    color:var(--ink-soft);
  }
  .meta-row b{color:var(--ink);font-weight:700;}

  footer{
    text-align:center;
    padding:18px 16px 26px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  footer .tag{font-weight:700;color:var(--ink);}
  footer .tag b{color:var(--malachite-dark);}
</style>
</head>

  <div id="genline" style="margin-top:4px;"></div>
</footer>

<script>
function show(id){
  ['loading','notfound','empty','card'].forEach(x=>{
    document.getElementById(x).style.display = (x===id) ? (x==='card'?'block':'flex') : 'none';
  });
  document.getElementById('loading').style.display = (id==='loading') ? 'block' : 'none';
}

function isDateStr(v){
  return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
}
function fmtDate(v){
  if(!isDateStr(v)) return v==null ? '—' : String(v);
  const [y,m,d] = v.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function fmtNum(v){
  if(v==null) return '—';
  return Number(v).toLocaleString();
}

function goToBatch(fromEmpty){
  const inputId = fromEmpty ? 'searchInput2' : 'searchInput';
  const val = document.getElementById(inputId).value.trim().toUpperCase();
  if(!val) return;
  const url = new URL(window.location.href);
  url.searchParams.set('batch', val);
  window.location.href = url.toString();
}
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    if(document.activeElement.id==='searchInput') goToBatch(false);
    if(document.activeElement.id==='searchInput2') goToBatch(true);
  }
});

async function init(){
  const params = new URLSearchParams(window.location.search);
  const batchId = (params.get('batch')||'').trim().toUpperCase();

  let data;
  try{
    const res = await fetch('batches.json', {cache:'no-store'});
    data = await res.json();
  }catch(err){
    document.getElementById('notfound-msg').textContent =
      "Couldn't load the batch data file (batches.json). Make sure it's hosted in the same folder as this page.";
    show('notfound');
    return;
  }

  document.getElementById('genline').textContent = 'Batch list updated ' + (data.generated || '');

  if(!batchId){
    show('empty');
    return;
  }

  const rec = data.batches[batchId];
  if(!rec){
    document.getElementById('notfound-msg').textContent =
      `"${batchId}" isn't in the current planned batch list.`;
    show('notfound');
    return;
  }

  // Fill fields
  document.getElementById('f-batch').textContent = rec.batch_number;
  document.getElementById('f-variety').textContent = rec.variety || '—';
  document.getElementById('f-type').textContent = rec.type || rec.crop || '';
  document.getElementById('f-crop').textContent = rec.crop || '—';
  document.getElementById('f-trays').textContent = fmtNum(rec.trays);
  document.getElementById('f-seed').textContent = fmtNum(rec.seed_requirement);
  document.getElementById('f-tables').textContent = fmtNum(rec.tables);
  document.getElementById('f-seedDate').textContent = fmtDate(rec.planned_seeding_date);
  document.getElementById('f-tp1').textContent = fmtDate(rec.tp1);
  document.getElementById('f-tp2').textContent = fmtDate(rec.tp2);
  document.getElementById('f-harvest').textContent = fmtDate(rec.harvest);

  // Timeline + status
  const today = new Date(); today.setHours(0,0,0,0);
  const stages = [
    {key:'seed', label:'Seed', val:rec.planned_seeding_date},
    {key:'tp1', label:'TP 1', val:rec.tp1},
    {key:'tp2', label:'TP 2', val:rec.tp2},
    {key:'harvest', label:'Harvest', val:rec.harvest},
  ];

  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  let currentSet = false;
  let statusText = '';
  let statusClass = '';

  // determine overall status using only stages that are real dates
  const dated = stages.filter(s => isDateStr(s.val)).map(s => ({...s, d:new Date(s.val)}));

  stages.forEach((s, idx)=>{
    const node = document.createElement('div');
    node.className = 'tl-node';
    const asDate = isDateStr(s.val) ? new Date(s.val) : null;

    let cls = 'pending';
    if(asDate){
      if(asDate <= today) cls = 'complete';
      if(!currentSet && asDate >= today){ cls='current'; currentSet = true; }
    }
    node.classList.add(cls);
    node.innerHTML = `<div class="tl-dot"></div>
      <div class="tl-label">${s.label}</div>
      <div class="tl-date">${s.val==null ? '—' : fmtDate(s.val)}</div>`;
    tl.appendChild(node);
  });

  if(dated.length){
    const last = dated[dated.length-1];
    if(today > last.d && last.key==='harvest'){
      statusText = 'Harvested'; statusClass='done';
    } else if(today < dated[0].d){
      statusText = 'Not yet sown'; statusClass='notyet';
    } else {
      // find current stage in progress
      let stageName = dated[0].label;
      for(const s of dated){ if(s.d <= today) stageName = s.label; }
      statusText = `In progress — past ${stageName}`;
    }
  } else {
    statusText = 'Dates pending';
    statusClass = 'notyet';
  }
  const statusEl = document.getElementById('status');
  statusEl.textContent = statusText;
  statusEl.className = 'status-pill' + (statusClass ? ' '+statusClass : '');

  show('card');
}
init();
</script>

</body>
</html>
